name: Build & Publish Utang Tracker APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Android APK
        run: gradle :app:assembleDebug

      - name: Prepare APK for distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/UtangTracker-v1.0.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtangTracker-APK
          path: dist/UtangTracker-v1.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Utang Tracker {0}', github.ref_name) || 'Utang Tracker (Latest Build)' }}
          make_latest: true
          body: |
            Download **UtangTracker-v1.0.apk** below and install it on your Android device (Android 8.0 / API 26 or higher).
          files: dist/UtangTracker-v1.0.apk
